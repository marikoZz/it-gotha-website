<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>it-gotha.de – im Aufbau</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0b3fa8">
<style>
  :root { --blau:#0b3fa8; --gold:#ffc94a; --hell:#c9d6f5; }
  * { box-sizing: border-box; }
  html { font-size: 112.5%; -webkit-text-size-adjust: 100%; }
  @media (min-width: 48rem) { html { font-size: 125%; } }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column;
    background: var(--blau); color: #fff; line-height: 1.6;
    font-family: "Segoe UI", "Helvetica Neue", Helvetica, Roboto, Arial, system-ui, sans-serif;
  }
  a { color: var(--hell); text-underline-offset: .18em; }
  a:focus-visible { outline: 3px solid #fff; outline-offset: 3px; border-radius: 4px; }
  .wrap { width: 100%; max-width: 40rem; margin: 0 auto; padding: 0 1.25rem; }
  main { flex: 1; display: flex; align-items: center; padding: 4rem 0 3rem; }
  .logo { display: block; margin-bottom: 2rem; border-radius: 12px; box-shadow: 0 0 0 2px rgba(255,255,255,.35); }
  h1 { font-size: clamp(2rem, 6vw, 3rem); line-height: 1.12; letter-spacing: -.025em; margin: 0 0 .75rem; }
  p { margin: 0; color: var(--hell); font-size: 1.1rem; }
  footer { padding: 1.25rem 0; font-size: .8rem; }
  footer nav { display: flex; gap: 1.5rem; }
</style>
</head>
<body>
<main>
  <div class="wrap">
    <img class="logo" src="/favicon.svg" width="56" height="56" alt="">
    <h1>Hier entsteht gerade eine neue Website.</h1>
    <p>Schauen Sie bald wieder vorbei.</p>
  </div>
</main>
<footer>
  <div class="wrap">
    <nav aria-label="Rechtliches"><a href="/impressum">Impressum</a><a href="/datenschutz">Datenschutz</a></nav>
  </div>
</footer>
</body>
</html>
