<style>

  * { box-sizing: border-box; }

  .marke span { color:var(--tanne); }
  main { flex:1; display:flex; align-items:center; padding:4rem 0; }
  h1 { font-size:clamp(1.8rem,4.5vw,2.6rem); letter-spacing:-.02em; line-height:1.15; margin:0 0 1rem; }
  p { margin:0 0 1.75rem; color:var(--grau); max-width:32em; }
  .knopf { display:inline-block; background:var(--tanne); color:#fff; font-weight:700; text-decoration:none;
    padding:.8rem 1.4rem; border-radius:999px; margin:0 1rem 1rem 0; }
  .knopf:hover { background:#163a2f; }
  .tel { font-weight:700; }
